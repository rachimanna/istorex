# Render Blueprint: Dashboard → New → Blueprint → select this repository.
# Database + file storage: Supabase (free, permanent). Values marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: istorex
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to the Supabase project (eu-west-1)
    healthCheckPath: /api/health
    envVars:
      - key: APP_URL
        sync: false # https://istorex.onrender.com (your service URL)
      - key: DATABASE_URL
        sync: false # Supabase → Connect → Session pooler URI
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false # https://<project>.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false # region shown in Supabase → Storage → S3 connection
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_BUCKET_IPA
        value: istorex-ipa
      - key: S3_BUCKET_MEDIA
        value: istorex-media
      - key: S3_BUCKET_BACKUP
        value: istorex-backup
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_IPA_SIZE_MB
        value: "50" # Supabase free tier limits a single file to 50 MB
      - key: DOWNLOADS_PER_IP_PER_DAY
        value: "30"
      - key: MONTHLY_EGRESS_BUDGET_GB
        value: "4" # Supabase free tier includes ~5 GB egress per month
      - key: CONTACT_EMAIL
        sync: false
      - key: ABUSE_EMAIL
        sync: false
